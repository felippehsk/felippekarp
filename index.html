<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Felippe Karp — Digital Agriculture Leader</title>
  <meta name="description" content="Instructor & Researcher at Olds College of Agriculture & Technology. Leading Canada's digital agriculture revolution.">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    (function () {
      var saved = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <style>
    :root {
      --forest: #1f4f36;
      --mint: #29c69a;
      --gold: #c9a227;
      --gold-soft: #d4b24a;

      --bg: #0b1210;
      --bg-glow: #13241c;
      --surface: #121c17;
      --surface-2: #18241e;
      --border: #2a3d32;
      --text: #e8efe9;
      --muted: #8fa396;
      --accent: var(--mint);
      --stamp: var(--gold-soft);
      --cta-bg: var(--forest);
      --cta-text: #ffffff;
      --chip-bg: transparent;
      --chip-border: var(--border);
      --chip-text: var(--text);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    html[data-theme="light"] {
      --bg: #f3f6f4;
      --bg-glow: #e4eee8;
      --surface: #ffffff;
      --surface-2: #eef3f0;
      --border: #c9d6ce;
      --text: #142018;
      --muted: #5d7166;
      --accent: var(--forest);
      --stamp: #9a7a12;
      --cta-bg: var(--forest);
      --cta-text: #ffffff;
      --chip-bg: #eef3f0;
      --chip-border: #c9d6ce;
      --chip-text: var(--forest);
      --shadow: 0 16px 40px rgba(31, 79, 54, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, var(--bg-glow), transparent 70%),
        linear-gradient(180deg, var(--bg) 0%, #0a100e 100%);
      background-attachment: fixed;
      min-height: 100vh;
      line-height: 1.55;
      transition: background 0.35s ease, color 0.35s ease;
    }

    ::selection { background: color-mix(in srgb, var(--mint) 35%, transparent); }

    a { color: inherit; }

    .top-controls {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .control-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s, background 0.2s;
    }

    .control-btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 22px 80px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: rise 0.7s ease both;
    }

    .brand-logo {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      display: block;
      object-fit: cover;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      text-align: left;
    }

    .profile {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid color-mix(in srgb, var(--mint) 55%, var(--border));
    }

    .identity-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .role-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--stamp);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.25rem, 4vw, 1.55rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .title-line {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.4;
      text-align: left;
      width: 100%;
      border-left: 2px solid var(--stamp);
      padding-left: 14px;
      margin-top: 8px;
      animation: rise 0.8s ease 0.08s both;
    }

    .cta-row {
      display: flex;
      gap: 10px;
      width: 100%;
      animation: rise 0.8s ease 0.14s both;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 14px;
      border-radius: 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border-color 0.2s;
    }

    .btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--cta-bg);
      color: var(--cta-text);
      box-shadow: 0 8px 22px color-mix(in srgb, var(--forest) 40%, transparent);
    }

    .btn-primary:hover {
      background: #256344;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px color-mix(in srgb, var(--forest) 50%, transparent);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      animation: rise 0.75s ease 0.18s both;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: rise 0.7s ease both;
    }

    .section-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--stamp);
    }

    .section-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: -6px;
    }

    .section-hint a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .section-hint a:hover { text-decoration: underline; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--chip-text);
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      padding: 7px 12px;
      border-radius: 999px;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 14px;
    }

    .reveal-btn {
      background: none;
      border: none;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      padding: 0;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
    }

    .reveal-btn:hover,
    .reveal-btn.revealed { color: var(--accent); }

    a.reveal-btn { text-decoration: none; }

    .reveal-btn svg,
    .contact-loc svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.75;
    }

    .contact-loc {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    .contact-loc:hover { color: var(--accent); }

    .links-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 6px;
    }

    .link-icon {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.2s, transform 0.2s, color 0.2s, background 0.2s;
    }

    .link-icon:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .link-icon svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .link-icon img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      display: block;
    }

    .timeline {
      display: flex;
      flex-direction: column;
    }

    .timeline-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.5;
    }

    .timeline-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 7px;
      flex-shrink: 0;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--mint) 18%, transparent);
    }

    .project-list {
      display: flex;
      flex-direction: column;
    }

    .project-item {
      display: block;
      text-decoration: none;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      transition: opacity 0.2s;
    }

    .project-item:first-child { padding-top: 2px; }
    .project-item:hover { opacity: 0.85; }

    .project-item h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .project-item h3::after {
      content: ' ↗';
      font-size: 0.85em;
      color: var(--accent);
      opacity: 0.7;
    }

    .project-item.no-link h3::after { content: none; }

    .project-item p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .accordion {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .acc-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .acc-item.open { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }

    .acc-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: none;
      border: none;
      padding: 13px 14px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
    }

    .acc-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .acc-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--stamp);
      background: var(--surface-2);
      border-radius: 999px;
      padding: 2px 8px;
    }

    .acc-chevron {
      color: var(--muted);
      font-size: 12px;
      transition: transform 0.25s ease;
    }

    .acc-item.open .acc-chevron { transform: rotate(90deg); }

    .acc-body {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 0 14px 14px;
    }

    .acc-item.open .acc-body { display: flex; }

    .pub-item {
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .pub-item a,
    .pub-item .pub-title {
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
      text-decoration: none;
      display: block;
      margin-bottom: 4px;
    }

    .pub-item a:hover { color: var(--accent); }

    .pub-item a::after {
      content: ' ↗';
      font-size: 0.85em;
      opacity: 0.65;
    }

    .pub-meta {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.4;
    }

    .media-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .media-list a {
      font-size: 13px;
      color: var(--text);
      text-decoration: none;
      line-height: 1.45;
    }

    .media-list a:hover { color: var(--accent); }

    .media-list b { color: var(--accent); font-weight: 600; }

    footer {
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    /* QR modal */
    .qr-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fade 0.2s ease;
    }

    .qr-modal.active { display: flex; }

    .qr-modal-content {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px 28px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-shadow: var(--shadow);
    }

    .qr-modal-close {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .qr-modal-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .qr-modal-hint {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 14px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }

    #qrcode img, #qrcode canvas {
      border-radius: 8px;
      background: #fff;
      padding: 8px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 480px) {
      .page { padding: 64px 16px 64px; gap: 30px; }
      .cta-row { flex-direction: column; }
      .top-controls { top: 12px; right: 12px; }
      .brand-logo { width: 100px; height: 100px; border-radius: 24px; }
      .identity { gap: 12px; }
      .profile { width: 84px; height: 84px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

              <a class="link-icon" href="${LINKS.faculty}" target="_blank" rel="noopener" title="${esc(c.faculty)}" aria-label="${esc(c.faculty)}"><img src="assets/images/olds-college-logo.png" alt=""></a>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section-label">${esc(c.academicLabel)}</div>
          <div class="timeline">${academic}</div>
        </section>

        <section class="section">
          <div class="section-label">${esc(c.projectsLabel)}</div>
          <div class="project-list">${projects}</div>
        </section>

        <section class="section">
          <div class="section-label">${esc(c.pubSectionLabel)}</div>
          <p class="section-hint">${esc(c.pubHint)}</p>
          <div class="accordion">${pubs}</div>
        </section>

        <section class="section">
          <div class="acc-item${fundingOpen ? ' open' : ''}">
            <button class="acc-trigger" type="button" onclick="toggleFunding()" aria-expanded="${fundingOpen}">
              <span>${esc(c.fundingLabel)}</span>
              <span class="acc-meta">
                <span class="acc-count">${c.funding.length}</span>
                <span class="acc-chevron" aria-hidden="true">▸</span>
              </span>
            </button>
            <div class="acc-body">${fundingItems}</div>
          </div>
        </section>

        <section class="section">
          <div class="acc-item${awardsOpen ? ' open' : ''}">
            <button class="acc-trigger" type="button" onclick="toggleAwards()" aria-expanded="${awardsOpen}">
              <span>${esc(c.awardsLabel)}</span>
              <span class="acc-meta">
                <span class="acc-count">${c.awards.length}</span>
                <span class="acc-chevron" aria-hidden="true">▸</span>
              </span>
            </button>
            <div class="acc-body">
              <p class="section-hint" style="margin:0 0 4px; padding-top:2px;">
                ${esc(c.awardsHint)}
                <a href="${AWARDS_PAGE}" target="_blank" rel="noopener">${esc(c.awardsLinkLabel)}</a>
                ·
                <a href="${CEREMONY_PAGE}" target="_blank" rel="noopener">${esc(c.ceremonyLabel)}</a>
              </p>
              ${awards}
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section-label">${esc(c.mediaLabel)}</div>
          <div class="media-list">${media}</div>
        </section>

        <footer>${esc(c.footer)}</footer>
      `;

      document.getElementById('lang-btn').textContent = currentLang === 'en' ? 'PT' : 'EN';
      document.documentElement.lang = currentLang === 'en' ? 'en' : 'pt-BR';
      updateThemeButton();
    }

    function togglePub(key) {
      openPubs[key] = !openPubs[key];
      render();
    }

    function toggleFunding() {
      fundingOpen = !fundingOpen;
      render();
    }

    function toggleAwards() {
      awardsOpen = !awardsOpen;
      render();
    }

    function revealEmail() {
      emailRevealed = true;
      render();
    }

    function revealPhone() {
      phoneRevealed = true;
      render();
    }

    function switchLang() {
      currentLang = currentLang === 'en' ? 'pt' : 'en';
      localStorage.setItem('lang', currentLang);
      render();
    }

    function updateThemeButton() {
      const theme = document.documentElement.getAttribute('data-theme') || 'dark';
      const btn = document.getElementById('theme-btn');
      if (btn) btn.textContent = theme === 'dark' ? '☀' : '●';
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton();
    }

    function downloadVCard() {
      const c = t();
      const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Felippe Karp
N:Karp;Felippe;Hoffmann Silva;Dr.;
TITLE:${c.title}
ORG:Olds College of Agriculture & Technology
TEL;TYPE=CELL:${decodePhone()}
EMAIL:${decodeEmail()}
URL:${LINKS.linkedIn}
URL:${LINKS.scholar}
URL:${LINKS.orcid}
URL:${LINKS.github}
URL:${LINKS.faculty}
ADR:;;Olds College;Olds;Alberta;;Canada
NOTE:PhD in Bioresource Engineering (McGill 2025). Principal Investigator, HyperLayer + Farm Credit Canada/AgExpert ($500k). National spokesperson for AI in Canadian agriculture. Research focus: Digital & Precision Agriculture\\, AI in Farming\\, Multi-Source Data Fusion.
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'Felippe_Karp_Contact.vcf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.URL.revokeObjectURL(url);
    }

    function generateQR() {
      const c = t();
      document.getElementById('qr-modal-title').textContent = c.qrTitle;
      document.getElementById('qr-modal-hint').textContent = c.qrHint;

      if (!qrGenerated) {
        const vCardData = `BEGIN:VCARD
VERSION:3.0
FN:Felippe Karp
TEL;TYPE=CELL:${decodePhone()}
EMAIL:${decodeEmail()}
URL:${LINKS.linkedIn}
URL:${LINKS.orcid}
URL:${LINKS.github}
ORG:Olds College of Agriculture & Technology
TITLE:Instructor & Researcher
END:VCARD`;

        new QRCode(document.getElementById('qrcode'), {
          text: vCardData,
          width: 256,
          height: 256,
          colorDark: '#1f4f36',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H,
        });
        qrGenerated = true;
      }

      document.getElementById('qr-modal').classList.add('active');
    }

    function closeQR(event) {
      if (event && event.type === 'click' && event.target !== event.currentTarget) return;
      document.getElementById('qr-modal').classList.remove('active');
    }

    document.getElementById('lang-btn').addEventListener('click', switchLang);
    document.getElementById('theme-btn').addEventListener('click', toggleTheme);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeQR();
    });

    render();
  </script>
</body>
</html>
